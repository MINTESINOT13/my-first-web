<section class="hero">
  <h1>Feedback 💬</h1>

<section class="cards" style="max-width:500px; margin:auto;">
  <div class="card">
    <form>
      <input type="text" placeholder="Your Name" style="width:100%; padding:10px; margin-bottom:10px;">
      <input type="email" placeholder="Your Email" style="width:100%; padding:10px; margin-bottom:10px;">
      <textarea placeholder="Your Message" rows="5" style="width:100%; padding:10px;"></textarea>
      <br><br>
      <button type="submit" style="padding:10px 20px; border:none; border-radius:20px; background:#38bdf8;">
        Send
        
      </button>
      
    </form>
  </div>
</section>
